[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "se-python-last-homework"
version = "0.1.0"
description = "SE Python last homework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.10.0",
    "qt-material>=2.17",
    "opencv-python>=4.13.0",
    "numpy>=2.4.0",
    "mediapipe>=0.10.32",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.18.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dual_dance_coach"]
